name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra anthropic --extra openai

      - name: Lint
        run: uv run ruff check chimera/

      - name: Type-check
        run: uv run mypy chimera/

      - name: Run tests (excluding live)
        # WHY: ``-m "not live"`` skips the opt-in CHIMERA_MINK_LIVE / Ollama
        # tests; those run only in .github/workflows/mink-live.yml on
        # workflow_dispatch or PRs labelled ``live``.
        run: uv run pytest tests/ --ignore=tests/benchmarks -m "not live" --tb=line -q

  docs:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install docs dependencies
        run: cd site && pnpm install

      - name: Build docs
        run: cd site && pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist

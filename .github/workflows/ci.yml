name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra anthropic --extra openai

      - name: Lint
        run: uv run ruff check chimera/

      - name: Type-check
        run: uv run mypy chimera/

      - name: Run tests (excluding live)
        # WHY: ``-m "not live"`` skips the opt-in CHIMERA_MINK_LIVE / Ollama
        # tests; those run only in .github/workflows/mink-live.yml on
        # workflow_dispatch or PRs labelled ``live``.
        run: uv run pytest tests/ --ignore=tests/benchmarks -m "not live" --tb=line -q

  trademark-scrub:
    # WHY: enforce every codename's trademark policy in ONE job. This was
    # 5 separate jobs (otter/mink/ferret/weasel/shrew) each spinning up a
    # hosted runner for a ~5-second grep — which multiplied the
    # runner-acquisition surface, so a transient GitHub capacity hiccup on
    # any single one ("job was not acquired by Runner of type hosted")
    # hung ~15 min and failed the whole build (runs 29017997201 /
    # 29018254630, 2026-07-09). all_trademark_scrub.sh runs the same
    # per-codename scrubs developers run locally (and covers badger + stoat
    # too) in a single runner — identical checks, far less flake surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run all trademark scrubs
        run: bash scripts/all_trademark_scrub.sh

  docs-sync-check:
    # WHY: docs/otter/ and docs/mink/ are canonical Markdown sources;
    # site/src/content/docs/otter/ and site/src/content/docs/mink/ are
    # the Astro/Starlight mirror.  Without a check, the two trees drift
    # silently (wave-1 W7 flagged this as Risk #4 in W7-REPORT.md).
    # ``scripts/sync_docs.sh --check`` exits 1 if any mirrored file is
    # out of sync with its canonical source; developers fix locally by
    # running ``bash scripts/sync_docs.sh`` (no flag) and committing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run docs sync check
        run: bash scripts/sync_docs.sh --check

  docs:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install docs dependencies
        run: cd site && pnpm install

      - name: Build docs
        run: cd site && pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Top-level permissions are intentionally minimal.  The publish-pypi job
# below requests ``id-token: write`` for itself so the OIDC step can mint
# the short-lived token PyPI expects from a Trusted Publisher.
permissions:
  contents: write

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify tag matches pyproject.toml version
        id: version
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_REF#v}"
          PROJECT_VERSION=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "Tag version:     $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $TAG_REF does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      - name: List build artifacts
        run: ls -la dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    # Single-job publish with two strategies:
    #   1. Trusted Publishing (OIDC, no secrets) — preferred.
    #   2. PYPI_API_TOKEN repo secret — fallback.
    #
    # The OIDC step runs first.  If the repo has been registered as a
    # Trusted Publisher on PyPI, that step succeeds and the token step
    # is skipped.  If OIDC is not yet registered (or is explicitly
    # disabled via ``vars.PUBLISH_USE_TOKEN == 'true'``), the token
    # step takes over.  Either path uses ``skip-existing: true`` so a
    # re-run on a tag whose artifacts already uploaded is a no-op.
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # ``id-token: write`` is required for PyPI Trusted Publishing OIDC.
    # Keep at job scope so other jobs cannot accidentally mint tokens.
    permissions:
      id-token: write
    environment:
      name: release
      url: https://pypi.org/p/chimera-run
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        id: publish_oidc
        # Skip the OIDC attempt only when the operator explicitly opts
        # out via repo/environment variable ``PUBLISH_USE_TOKEN``.
        # ``continue-on-error`` lets the workflow keep running if the
        # Trusted Publisher is not yet registered — the token fallback
        # step then takes over.
        if: vars.PUBLISH_USE_TOKEN != 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish to PyPI via API token (fallback)
        # Runs when the OIDC step did not succeed: either it failed
        # (Trusted Publisher not registered yet), was cancelled, or was
        # skipped via ``vars.PUBLISH_USE_TOKEN``.  Once Trusted
        # Publishing is in place this branch never runs and the
        # ``PYPI_API_TOKEN`` secret can be deleted.
        if: steps.publish_oidc.outcome != 'success'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github-release:
    name: Attach artifacts to GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

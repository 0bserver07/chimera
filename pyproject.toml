[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chimera-run"
version = "0.8.2.dev0"
description = "Build, compose, and deploy coding agents from modular primitives."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chimera Contributors"}]
keywords = ["agentic-coding", "coding-agents", "ai-agents", "swe-bench", "code-generation", "agent-framework", "llm-tools", "program-synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/0bserver07/chimera"
Documentation = "https://0bserver07.github.io/chimera"
Repository = "https://github.com/0bserver07/chimera"
Issues = "https://github.com/0bserver07/chimera/issues"
Changelog = "https://github.com/0bserver07/chimera/blob/master/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
browser = ["playwright>=1.40"]
docker = ["docker>=7.0"]
remote = ["httpx>=0.27"]
mink = ["rich>=13.7", "pygments>=2.17"]
notebook = ["nbformat>=5"]
mcp = ["websockets>=12"]
ssh = ["asyncssh>=2.14"]
tui = ["textual>=0.50"]
modal-sandbox = ["modal>=0.62"]
e2b = ["e2b>=1.0"]
all = ["chimera-run[anthropic,openai,browser,remote,mink,notebook,mcp,ssh,tui,modal-sandbox,e2b]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyyaml>=6.0",
    # Test deps: hub adapters mock these but need them importable
    "huggingface_hub>=0.25",
    "boto3>=1.34",
]
function_synthesis = ["llama-cpp-python>=0.3.0", "huggingface_hub>=0.25"]
function_synthesis_s3 = ["boto3>=1.34"]
function_synthesis_compile = [
    "transformers>=4.40",
    "peft>=0.10",
    "torch>=2.0",
    "datasets>=2.18",
]
function_synthesis_transformers = [
    "transformers>=4.40",
    "peft>=0.10",
    "torch>=2.0",
    "safetensors>=0.4",
]
function_synthesis_onnx = [
    "onnxruntime>=1.18",
    "transformers>=4.40",
    "optimum[onnxruntime]>=1.24",
]

[project.scripts]
chimera = "chimera.cli.main:main"
chimera-team-mcp = "chimera.mcp_servers.team_server:main"
chimera-team-run = "chimera.mcp_servers.teammate_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["chimera"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that hit real models/networks (run with `pytest -m live`)",
    "integration: end-to-end integration tests (select with `pytest -m integration`)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests commonly need: conditional imports after env setup (E402),
# single-letter loop vars (E741 — `l` for line, etc).
"tests/**/*.py" = ["E402", "E741"]
# Examples: short iteration vars are readable in small scripts.
"examples/**/*.py" = ["E741"]

[tool.mypy]
python_version = "3.11"
strict = true
# Optional-dep imports use `# type: ignore[import-not-found]` which flips
# between used/unused depending on whether the dep is installed in the
# current venv. Don't flag that as a lint failure.
warn_unused_ignores = false

# Optional-extra deps without bundled stubs. Suppress the missing-stub error
# at the import site so a bare `mypy chimera/` stays clean without forcing
# the extras (mcp, mink, notebook, ssh) to install in the dev env.
[[tool.mypy.overrides]]
module = [
    "chimera.cli.render",
    "chimera.env.ssh",
    "chimera.eval.benchmarks.humaneval_plus",
    "chimera.mcp.ws_transport",
    "chimera.mink.cost",
    "chimera.otter.tui",
    "chimera.tools.notebook_edit",
]
disable_error_code = ["import-not-found"]

# asyncssh ships no PEP 561 marker. Silence the missing-stubs error so
# `mypy chimera/` stays clean both with and without the [ssh] extra
# installed.
[[tool.mypy.overrides]]
module = ["asyncssh", "asyncssh.*"]
ignore_missing_imports = true

# modal ships no PEP 561 stubs. Same posture as asyncssh — keep
# `mypy chimera/` clean whether the [modal-sandbox] extra is
# installed or not.
[[tool.mypy.overrides]]
module = ["modal", "modal.*"]
ignore_missing_imports = true

# nbformat ships no PEP 561 stubs. The module-level `disable_error_code`
# override above does not suppress missing-stub errors in mypy 1.19+, so
# we also need this import-target override to keep `mypy chimera/` clean
# whether the [notebook] extra is installed or not.
[[tool.mypy.overrides]]
module = ["nbformat", "nbformat.*"]
ignore_missing_imports = true

# WHY: benchmark grader functions cast subprocess/library outputs to bool
# without an explicit narrowing. Acceptable since the value comes from a
# trusted internal harness and Any-return only triggers when --strict.
[[tool.mypy.overrides]]
module = [
    "chimera.eval.benchmarks.tau_bench",
    "chimera.eval.benchmarks.cline_bench",
]
disable_error_code = ["no-any-return"]

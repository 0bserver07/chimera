[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chimera-ai"
version = "0.2.0"
description = "Build, compose, and deploy coding agents from modular primitives."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chimera Contributors"}]
keywords = ["agentic-coding", "coding-agents", "ai-agents", "swe-bench", "code-generation", "agent-framework", "llm-tools", "program-synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/0bserver07/chimera"
Documentation = "https://0bserver07.github.io/chimera"
Repository = "https://github.com/0bserver07/chimera"
Issues = "https://github.com/0bserver07/chimera/issues"
Changelog = "https://github.com/0bserver07/chimera/blob/master/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
browser = ["playwright>=1.40"]
remote = ["httpx>=0.27"]
all = ["chimera-ai[anthropic,openai,browser,remote]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
function_synthesis = ["llama-cpp-python>=0.3.0", "huggingface_hub>=0.25"]
function_synthesis_compile = [
    "transformers>=4.40",
    "peft>=0.10",
    "torch>=2.0",
    "datasets>=2.18",
]

[project.scripts]
chimera = "chimera.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["chimera"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that hit real models/networks (run with `pytest -m live`)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests commonly need: conditional imports after env setup (E402),
# single-letter loop vars (E741 — `l` for line, etc).
"tests/**/*.py" = ["E402", "E741"]
# Examples: short iteration vars are readable in small scripts.
"examples/**/*.py" = ["E741"]

[tool.mypy]
python_version = "3.11"
strict = true
# Optional-dep imports use `# type: ignore[import-not-found]` which flips
# between used/unused depending on whether the dep is installed in the
# current venv. Don't flag that as a lint failure.
warn_unused_ignores = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chimera-ai"
version = "0.1.0"
description = "A composable coding agent framework. Synthesize codebases from specifications."
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
keywords = ["ai", "agents", "coding", "framework", "synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
browser = ["playwright>=1.40"]
remote = ["httpx>=0.27"]
all = ["chimera-ai[anthropic,openai,browser,remote]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
chimera = "chimera.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["chimera"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
